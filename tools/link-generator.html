<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Link Generator — Ayila &amp; Zidane</title>
<style>
  :root{--ink:#2c352d;--sage:#66755a;--ivory:#faf7f0;--line:rgba(138,154,123,.3)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.7 "Jost",system-ui,sans-serif;padding:28px 18px}
  .w{max-width:760px;margin:auto}
  h1{font:400 28px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
  p.sub{margin:0 0 24px;color:#7d8378;font-size:14px}
  label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#4a544a;margin-bottom:6px}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;font:inherit;margin-bottom:18px}
  textarea{min-height:150px;resize:vertical}
  button{background:var(--sage);color:#fffdf8;border:0;border-radius:999px;padding:13px 26px;font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  button.ghost{background:transparent;color:var(--sage);border:1px solid var(--sage)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  table{width:100%;border-collapse:collapse;background:#fffdf8;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{background:#eee9dc;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  td.link{word-break:break-all;color:var(--sage)}
  td.act{white-space:nowrap;width:1%}
  td.act button{padding:7px 12px;font-size:10px}
  tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="w">
  <h1>Guest Link Generator</h1>
  <p class="sub">Buat link undangan personal untuk setiap tamu. Nama tamu akan muncul otomatis di halaman sampul.</p>

  <label for="base">URL Undangan</label>
  <input id="base" type="url" placeholder="https://zidanezaffar.github.io/AyilaZidaneWedding/">

  <label for="names">Daftar Nama Tamu — satu nama per baris. Opsional per baris: <code>Nama, pax, sesi</code> (pax = jumlah tamu, sesi = <code>akad</code> / <code>resepsi</code> / kosongkan untuk keduanya)</label>
  <textarea id="names" placeholder="Ade Fitriyani&#10;Bapak Budi Santoso &amp; Keluarga, 2&#10;Rina Wulandari, 1, akad&#10;Tim Kantor, , resepsi"></textarea>

  <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px">
    <input type="checkbox" id="useCode" checked style="width:auto;margin:0">
    Sembunyikan nama/pax/sesi di link (pakai kode acak — <code>?g=AB12CD</code> — bukan <code>?to=&amp;pax=&amp;events=</code> polos)
  </label>

  <div class="row">
    <button id="gen">Buat Link</button>
    <button id="csv" class="ghost">Unduh CSV</button>
    <button id="copyAll" class="ghost">Salin Semua</button>
  </div>

  <table id="out" hidden><thead><tr><th>Nama</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>

  <div id="guestsBlock" hidden style="margin-top:26px">
    <label>Tempel blok ini ke <code>config.js ▸ guests</code> (menggantikan isi array yang ada) supaya kode di atas bisa dikenali situs</label>
    <textarea id="guestsCode" readonly style="min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px"></textarea>
    <div class="row"><button id="copyGuests" class="ghost">Salin Blok</button></div>
  </div>
</div>

<script>
// Same deterministic hash as the Excel formula in README.md § 5 --
// a stable, meaningless-looking code per row (position + name text),
// not derived from pax/events at all (those live in config.js's
// `guests` row, not encoded in the code), so it never changes across
// re-generation unless the name itself changes.
function guestCode(name, row){
  var weighted = 0;
  for (var i = 0; i < name.length; i++) weighted += name.charCodeAt(i) * (i + 1);
  var mod = Math.pow(36, 6);
  var seed = weighted * 1000003 + row * 97;
  var n = ((seed % mod) + mod) % mod;
  return n.toString(36).toUpperCase().padStart(6, '0');
}

var rows = [];
function build(){
  var base = document.getElementById('base').value.trim();
  if(!base){ alert('Isi URL undangan terlebih dahulu.'); return; }
  if(!/\/$/.test(base) && !/\.html$/.test(base)) base += '/';
  var useCode = document.getElementById('useCode').checked;
  rows = document.getElementById('names').value.split('\n')
    .map(function(s){return s.trim();}).filter(Boolean)
    .map(function(line, i){
      var parts = line.split(',');
      var name = parts[0].trim();
      var pax = parts.length > 1 ? parseInt(parts[1], 10) : NaN;
      var session = parts.length > 2 ? parts[2].trim().toLowerCase() : '';
      session = (session === 'akad' || session === 'resepsi') ? session : '';
      var code = guestCode(name, i + 1);
      var url;
      if (useCode) {
        url = base + '?g=' + code;
      } else {
        url = base + '?to=' + encodeURIComponent(name);
        if (pax >= 1) url += '&pax=' + pax;
        if (session) url += '&events=' + session;
      }
      return {name: name, pax: pax >= 1 ? pax : null, session: session || null, code: code, url: url};
    });

  var tb = document.querySelector('#out tbody');
  tb.innerHTML = rows.map(function(r,i){
    var tags = (r.pax ? ' <span style="color:#9aa190">(' + r.pax + ' pax)</span>' : '') +
               (r.session ? ' <span style="color:#9aa190">[' + r.session + ']</span>' : '');
    var name = r.name.replace(/</g,'&lt;') + tags;
    return '<tr><td>'+name+'</td><td class="link">'+r.url.replace(/</g,'&lt;')+
           '</td><td class="act"><button data-i="'+i+'" class="ghost">Salin</button></td></tr>';
  }).join('');
  document.getElementById('out').hidden = !rows.length;

  var guestsBlock = document.getElementById('guestsBlock');
  if (useCode && rows.length) {
    document.getElementById('guestsCode').value = rows.map(function(r){
      return '    { code: "' + r.code + '", name: "' + r.name.replace(/"/g,'\\"') +
             '", pax: ' + (r.pax || 'null') + ', events: "' + (r.session || '') + '" },';
    }).join('\n');
    guestsBlock.hidden = false;
  } else {
    guestsBlock.hidden = true;
  }
}
document.getElementById('gen').onclick = build;
document.querySelector('#out').addEventListener('click', function(e){
  var b = e.target.closest('button[data-i]'); if(!b) return;
  navigator.clipboard.writeText(rows[b.dataset.i].url);
  b.textContent = 'Tersalin'; setTimeout(function(){ b.textContent='Salin'; }, 1500);
});
document.getElementById('copyGuests').onclick = function(){
  navigator.clipboard.writeText(document.getElementById('guestsCode').value);
  this.textContent='Tersalin'; var b=this; setTimeout(function(){b.textContent='Salin Blok';},1500);
};
document.getElementById('copyAll').onclick = function(){
  if(!rows.length) return build();
  navigator.clipboard.writeText(rows.map(function(r){return r.name+' — '+r.url;}).join('\n'));
  this.textContent='Tersalin'; var b=this; setTimeout(function(){b.textContent='Salin Semua';},1500);
};
document.getElementById('csv').onclick = function(){
  if(!rows.length) build();
  var csv = 'Nama,Pax,Sesi,Kode,Link\n' + rows.map(function(r){return '"'+r.name.replace(/"/g,'""')+'","'+(r.pax||'')+'","'+(r.session||'')+'","'+r.code+'","'+r.url+'"';}).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'guest-links.csv'; a.click();
};
</script>
</body>
</html>
